# School server: the app plus a local open-weights model. No cloud needed. UNTESTED here: please try it and report issues.
#   LP_AGENT_TOKEN=<16+ random chars> LP_SECRET=<random> docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5:7b
#   docker compose exec app python manage.py add-class C-6B "Grade 6 Blue"   (then add-teacher, import-learners, consent)
services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      LP_AGENT_TOKEN: ${LP_AGENT_TOKEN:?set a 16+ character token}
      LP_SECRET: ${LP_SECRET:?set a random secret}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
    volumes: ["lpdata:/data"]
    depends_on: [ollama]
  ollama:
    image: ollama/ollama
    volumes: ["ollama:/root/.ollama"]
volumes: { lpdata: {}, ollama: {} }
